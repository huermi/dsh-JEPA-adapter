<svg viewBox="0 0 680 380" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif,system-ui,Segoe UI,Roboto,Helvetica,Arial">
  <rect width="680" height="380" fill="#0f1115"/>
  <!-- title -->
  <text x="24" y="30" fill="#e6edf3" font-size="16" font-weight="700">最小 CL-JEPA 核心（2× 编码器 + 1 预测器，O(1) 于任务数）</text>
  <text x="24" y="50" fill="#8b98a5" font-size="11.5">预测误差 E 同时是 学习信号 ∧ 资源表</text>

  <!-- boxes -->
  <!-- f_theta -->
  <rect x="28" y="84" width="132" height="58" rx="9" fill="#15233a" stroke="#3b82f6" stroke-width="1.6"/>
  <text x="94" y="108" fill="#cfe2ff" font-size="13" font-weight="700" text-anchor="middle">在线编码器</text>
  <text x="94" y="126" fill="#9cc2ff" font-size="11" text-anchor="middle">f_θ （唯一可学）</text>

  <!-- g_phi -->
  <rect x="216" y="84" width="132" height="58" rx="9" fill="#1a2c1f" stroke="#22c55e" stroke-width="1.6"/>
  <text x="282" y="108" fill="#c8f5d4" font-size="13" font-weight="700" text-anchor="middle">预测器</text>
  <text x="282" y="126" fill="#9af0b4" font-size="11" text-anchor="middle">g_φ （世界模型）</text>

  <!-- E -->
  <rect x="404" y="84" width="120" height="58" rx="9" fill="#2a2410" stroke="#eab308" stroke-width="1.6"/>
  <text x="464" y="108" fill="#fff1c2" font-size="13" font-weight="700" text-anchor="middle">预测误差 E</text>
  <text x="464" y="126" fill="#f5e08a" font-size="11" text-anchor="middle">= 学习 ∧ 资源</text>

  <!-- f_xi EMA -->
  <rect x="28" y="252" width="132" height="58" rx="9" fill="#2a1830" stroke="#a855f7" stroke-width="1.6"/>
  <text x="94" y="276" fill="#f0d6ff" font-size="13" font-weight="700" text-anchor="middle">目标编码器</text>
  <text x="94" y="294" fill="#d9a8ff" font-size="11" text-anchor="middle">f_ξ = EMA(f_θ)</text>

  <!-- arrows -->
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#7d8da0"/>
    </marker>
  </defs>
  <line x1="160" y1="113" x2="214" y2="113" stroke="#7d8da0" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="348" y1="113" x2="402" y2="113" stroke="#7d8da0" stroke-width="1.6" marker-end="url(#ar)"/>
  <!-- E -> update gate text -->
  <line x1="464" y1="142" x2="464" y2="178" stroke="#eab308" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="474" y="168" fill="#f5e08a" font-size="10.5">惊喜门控</text>
  <text x="474" y="182" fill="#8b98a5" font-size="10">E&gt;ε 才更新</text>
  <!-- f_theta down to f_xi EMA loop -->
  <line x1="94" y1="142" x2="94" y2="250" stroke="#a855f7" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#ar)"/>
  <text x="104" y="200" fill="#d9a8ff" font-size="10.5">ξ←(1−τ)ξ+τθ</text>
  <!-- f_xi up to g (target) -->
  <path d="M160,281 C260,320 360,300 282,146" fill="none" stroke="#a855f7" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#ar)"/>
  <text x="300" y="300" fill="#d9a8ff" font-size="10.5">sg(f_ξ(x_mask)) = s*</text>

  <!-- right panel: resource self-regulation -->
  <rect x="540" y="74" width="128" height="236" rx="10" fill="#11161d" stroke="#334155" stroke-width="1.2"/>
  <text x="604" y="96" fill="#e6edf3" font-size="12.5" font-weight="700" text-anchor="middle">资源自调节</text>
  <text x="604" y="114" fill="#8b98a5" font-size="10.5" text-anchor="middle">（由 E 驱动）</text>
  <circle cx="556" cy="140" r="3" fill="#22c55e"/>
  <text x="566" y="144" fill="#c8f5d4" font-size="10.5">内存恒定 O(1)</text>
  <circle cx="556" cy="168" r="3" fill="#22c55e"/>
  <text x="566" y="172" fill="#c8f5d4" font-size="10.5">E↓ ⇒ 掩码↑ 省算力</text>
  <circle cx="556" cy="196" r="3" fill="#22c55e"/>
  <text x="566" y="200" fill="#c8f5d4" font-size="10.5">E↓ ⇒ τ→1 更新趋零</text>
  <circle cx="556" cy="224" r="3" fill="#22c55e"/>
  <text x="566" y="228" fill="#c8f5d4" font-size="10.5">稳定维门控关 潜宽↓</text>
  <line x1="552" y1="248" x2="656" y2="248" stroke="#334155" stroke-width="1"/>
  <text x="604" y="270" fill="#8b98a5" font-size="10" text-anchor="middle">已删（非最小）</text>
  <text x="604" y="286" fill="#64748b" font-size="9.5" text-anchor="middle">CaSSLe头·回放缓冲</text>
  <text x="604" y="300" fill="#64748b" font-size="9.5" text-anchor="middle">LoRA·睡眠窗·5阶段</text>
</svg>
